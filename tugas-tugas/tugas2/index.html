<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalkulator Aritmatika</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    display: flex;
    justify-content: center;
    padding-top: 60px;
  }
  .kalkulator {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 280px;
  }
  h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    color: #555;
  }
  input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .tombol {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 4px;
    background: #4a90d9;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background: #3a7cc0;
  }
  .hasil {
    margin-top: 16px;
  }
  #output {
    background: #f0f0f0;
  }
</style>
</head>
<body>

<div class="kalkulator">
  <h2>Kalkulator Aritmatika</h2>

  <label for="bil1">Input Bilangan 1</label>
  <input type="number" id="bil1" placeholder="Masukkan angka pertama">

  <label for="bil2">Input Bilangan 2</label>
  <input type="number" id="bil2" placeholder="Masukkan angka kedua">

  <div class="tombol">
    <button onclick="hitung('+')">+</button>
    <button onclick="hitung('-')">-</button>
    <button onclick="hitung('*')">x</button>
    <button onclick="hitung('/')">/</button>
  </div>

  <div class="hasil">
    <label for="output">Output</label>
    <input type="text" id="output" readonly>
  </div>
</div>

<script>
  function hitung(operator) {
    let angka1 = parseFloat(document.getElementById("bil1").value);
    let angka2 = parseFloat(document.getElementById("bil2").value);
    let hasil;

    if (isNaN(angka1) || isNaN(angka2)) {
      document.getElementById("output").value = "Isi dulu kedua angkanya";
      return;
    }

    if (operator === "+") {
      hasil = angka1 + angka2;
    } else if (operator === "-") {
      hasil = angka1 - angka2;
    } else if (operator === "*") {
      hasil = angka1 * angka2;
    } else if (operator === "/") {
      if (angka2 === 0) {
        document.getElementById("output").value = "Tidak bisa dibagi 0";
        return;
      }
      hasil = angka1 / angka2;
    }

    document.getElementById("output").value = hasil;
  }
</script>

</body>
</html>
